name: Area resize study
on:
  push:
    branches: [codex/area-resize-study]
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: albumentations-team/ci-foundation/actions/setup-python-uv@6b9045dbea58026a1e8f96b0392c411934a27199
        with:
          activate-environment: "true"
          cache-dependency-glob: uv.lock
          cache-suffix: area-resize
          python-version: "3.11"
          uv-version: "0.12.0"
      - name: Benchmark
        shell: bash
        run: |
          set -euo pipefail
          uv pip install 'numpy==2.4.6' 'opencv-python-headless==5.0.0.93'
          mkdir -p results
          lscpu > results/cpu.txt
          g++ -std=c++17 -O3 -march=native -ffp-contract=off -shared -fPIC area.cpp -o area.so
          python -u probe.py > results/linux.csv 2> results/linux.log
          cat results/linux.csv results/linux.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: area-resize
          path: results/
