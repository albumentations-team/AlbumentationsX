name: Legal Integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal_integrity:
    name: License, CLA, and package notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install uv and Python
      uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      with:
        enable-cache: true
        python-version: "3.11"
        activate-environment: true
    - name: Verify source-tree legal integrity
      run: python tools/verify_legal_integrity.py
    - name: Test legal-integrity verifier
      run: uv run --no-project --with pytest pytest --noconftest -q tests/test_legal_integrity.py
    - name: Build wheel and source distribution
      run: uv build --out-dir "${RUNNER_TEMP}/albumentationsx-legal-dist"
    - name: Verify distribution notices and CLA exclusion
      run: >-
        python tools/verify_legal_integrity.py --artifacts
        "${RUNNER_TEMP}"/albumentationsx-legal-dist/*.whl
        "${RUNNER_TEMP}"/albumentationsx-legal-dist/*.tar.gz
    - name: Check distribution metadata
      run: uv tool run --from twine twine check "${RUNNER_TEMP}"/albumentationsx-legal-dist/*
