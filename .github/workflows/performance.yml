name: Performance

on:
  pull_request:
    branches:
      - main
    paths:
      - "albumentations/**"
      - "benchmark/**"
      - ".github/workflows/performance.yml"
  push:
    branches:
      - main
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Optional git ref/SHA for the before baseline. Leave empty to run evidence for the selected ref only."
        required: false
        type: string
      candidate_ref:
        description: "Optional git ref/SHA for the after candidate. Defaults to the selected workflow ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  asv_smoke:
    name: ASV benchmark evidence
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
    - name: Install uv and Python 3.12
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: "3.12"
        activate-environment: true
    - name: Install dependencies
      run: uv sync --locked --group dev --inexact --no-install-package torch --no-install-package torchvision
    - name: Collect benchmark environment evidence
      run: >
        uv run python tools/collect_test_environment.py
        --output benchmark-evidence/environment-benchmark.json
        --command "asv continuous/run performance evidence"
    - name: Register ASV machine profile
      working-directory: benchmark
      run: uv tool run --from asv asv --config asv.conf.json machine --yes
    - name: Check benchmark suite importability
      working-directory: benchmark
      run: uv tool run --from asv asv --config asv.conf.json check
    - name: Compare baseline and candidate benchmarks
      if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.baseline_ref != '')
      working-directory: benchmark
      run: |
        set -o pipefail
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASELINE_REF="${{ github.event.pull_request.base.sha }}"
          CANDIDATE_REF="${{ github.event.pull_request.head.sha }}"
        else
          BASELINE_REF="${{ inputs.baseline_ref }}"
          CANDIDATE_REF="${{ inputs.candidate_ref }}"
          if [ -z "$CANDIDATE_REF" ]; then
            CANDIDATE_REF="HEAD"
          fi
        fi
        uv tool run --from asv asv --config asv.conf.json continuous \
          --factor 1.05 \
          --split \
          --show-stderr \
          --attribute repeat=1 \
          --attribute number=1 \
          "$BASELINE_REF" \
          "$CANDIDATE_REF" \
          2>&1 | tee "$GITHUB_WORKSPACE/benchmark-evidence/asv-continuous.txt"
    - name: Run scheduled benchmark evidence
      if: >
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.baseline_ref == '')
      working-directory: benchmark
      run: |
        set -o pipefail
        uv tool run --from asv asv --config asv.conf.json run \
          --show-stderr \
          --durations 20 \
          --attribute repeat=1 \
          --attribute number=1 \
          'HEAD^!' \
          2>&1 | tee "$GITHUB_WORKSPACE/benchmark-evidence/asv-run.txt"
    - name: Upload benchmark artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: benchmark-evidence
        path: |
          benchmark-evidence/
          benchmark/.asv/results/
        if-no-files-found: ignore
