name: PyTorch Tensor Performance

on:
  schedule:
    - cron: "53 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytorch_tensor_asv:
    name: PyTorch tensor benchmark evidence
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - name: Install uv and Python 3.12
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        python-version: "3.12"
        activate-environment: true
    - name: Install tooling dependencies
      run: uv sync --locked --group dev --inexact --no-install-package torch --no-install-package torchvision
    - name: Collect PyTorch benchmark environment evidence
      run: >
        uv run --no-sync python tools/collect_test_environment.py
        --output pytorch-benchmark-evidence/environment-pytorch-benchmark.json
        --command "asv run optional PyTorch tensor benchmark evidence"
    - name: Register PyTorch ASV machine profile
      working-directory: benchmark
      run: uv tool run --from asv asv --config asv-pytorch.conf.json machine --yes
    - name: Check PyTorch benchmark suite importability
      working-directory: benchmark
      run: uv tool run --from asv asv --config asv-pytorch.conf.json check --verbose
    - name: Run PyTorch tensor benchmark evidence
      working-directory: benchmark
      run: |
        set -o pipefail
        uv tool run --from asv asv --config asv-pytorch.conf.json run \
          --quick \
          --show-stderr \
          --attribute repeat=1 \
          --attribute number=1 \
          'HEAD^!' \
          2>&1 | tee "$GITHUB_WORKSPACE/pytorch-benchmark-evidence/asv-pytorch-run.txt"
    - name: Upload PyTorch benchmark artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: pytorch-benchmark-evidence
        path: |
          pytorch-benchmark-evidence/
          benchmark/.asv/pytorch-results/
        if-no-files-found: ignore
