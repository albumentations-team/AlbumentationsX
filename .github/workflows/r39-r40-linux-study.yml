name: R39 and R40 plasma A-B
on:
  push:
    branches: [codex/r39-r40-linux-study]
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: b0664b345eef61edf578eff41fb59d64b5766e1a
          path: ax
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: albumentations-team/benchmark
          ref: ae173f2012d4cac9fc1573b2930aab820ebea60c
          path: rgb-catalog
          persist-credentials: false
      - uses: albumentations-team/ci-foundation/actions/setup-python-uv@6b9045dbea58026a1e8f96b0392c411934a27199
        with:
          activate-environment: "true"
          cache-dependency-glob: uv.lock
          cache-suffix: r39-r40
          python-version: "3.11"
          uv-version: "0.12.0"
      - name: Compare plasma generation routes
        shell: bash
        run: |
          set -euo pipefail
          uv pip install 'albucore==0.3.9' 'numpy==2.4.6' 'opencv-python-headless==5.0.0.93' 'numkong==7.8.7' 'stringzilla==5.3.2' pydantic pyyaml scipy typing-extensions 'simplejpeg==1.9.0' pytest hypothesis scikit-learn pytest-mock
          uv pip install 'torch==2.15.0' --index https://download.pytorch.org/whl/cpu
          sed -i 's/^type Uint8Array =/Uint8Array =/' rgb-catalog/src/augbench/datasets/loaders.py
          mkdir -p results
          lscpu > results/cpu.txt
          PYTHONPATH="$PWD/ax:$PWD/rgb-catalog/src" python -u r39-r40-probe.py "$PWD/rgb-catalog" "${RUNNER_TEMP}/r39-r40-jpegs" results/linux.csv | tee results/environment.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r39-r40-linux
          path: results/
