name: R42 SaltAndPepper benchmark
on:
  push:
    branches: [codex/r42-linux-benchmark]
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: albumentations-team/benchmark
          ref: ae173f2012d4cac9fc1573b2930aab820ebea60c
          path: rgb-catalog
          persist-credentials: false
      - uses: albumentations-team/ci-foundation/actions/setup-python-uv@6b9045dbea58026a1e8f96b0392c411934a27199
        with:
          activate-environment: "true"
          cache-dependency-glob: uv.lock
          cache-suffix: r42
          python-version: "3.13"
          uv-version: "0.12.0"
      - name: Compare main and PR
        shell: bash
        run: |
          set -euo pipefail
          uv pip install 'albucore==0.3.8' 'numpy==2.5.4' 'opencv-python-headless==5.0.0.93' 'numkong==7.8.7' 'stringzilla==5.3.2' pydantic pyyaml scipy typing-extensions simplejpeg pytest pytest-mock hypothesis pytest-xdist
          uv pip install 'torch==2.15.0' --index https://download.pytorch.org/whl/cpu
          mkdir -p results
          lscpu > results/cpu.txt
          python -m pytest -q tests/test_augmentations.py tests/functional/test_functional.py tests/transforms3d/test_noise_target_semantics.py -k 'salt_and_pepper or salt-and-pepper'
          PYTHONPATH="$PWD:$PWD/rgb-catalog/src" python -u r42-paired.py "$PWD" "$PWD/rgb-catalog" "${RUNNER_TEMP}/r42-jpegs" results/matrix.csv | tee results/environment.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r42-linux-matrix
          path: results/
