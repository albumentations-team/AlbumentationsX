name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

jobs:
  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.11"
        activate-environment: true
    - name: Export locked runtime dependencies
      run: >
        uv export --frozen --no-dev --no-emit-project
        --format requirements-txt
        --output-file runtime-requirements.txt
    - name: Run pip-audit
      run: uv tool run --from pip-audit pip-audit --requirement runtime-requirements.txt --no-deps

  workflow_audit:
    name: GitHub Actions hardening audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.11"
        activate-environment: true
    - name: Run zizmor
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        uv tool run --from zizmor zizmor
        --format=github
        --min-severity=medium
        --min-confidence=medium
        .github

  codeql:
    name: CodeQL Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        build-mode: none
        queries: security-and-quality
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4
