name: Security

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

jobs:
  # CodeQL is managed by GitHub default setup for this repository. Adding an
  # advanced CodeQL workflow here makes GitHub reject uploaded SARIF.
  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        python-version: "3.11"
        activate-environment: true
    - name: Prepare security evidence directory
      run: python -c "from pathlib import Path; Path('security-evidence').mkdir(exist_ok=True)"
    - name: Export locked runtime dependencies
      run: >
        uv export --frozen --no-dev --no-emit-project
        --format requirements-txt
        --output-file runtime-requirements.txt
    - name: Run pip-audit
      run: >
        uv tool run --from pip-audit pip-audit
        --requirement runtime-requirements.txt
        --no-deps
        --disable-pip
        --format=json
        --output security-evidence/security-pip-audit.json
    - name: Upload dependency audit evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: dependency-audit-evidence
        path: security-evidence/
        if-no-files-found: ignore

  workflow_audit:
    name: GitHub Actions hardening audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        python-version: "3.11"
        activate-environment: true
    - name: Prepare security evidence directory
      run: python -c "from pathlib import Path; Path('security-evidence').mkdir(exist_ok=True)"
    - name: Run zizmor
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        uv tool run --from zizmor zizmor
        --format=github
        --min-severity=medium
        --min-confidence=medium
        .github
    - name: Collect zizmor JSON evidence
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        uv tool run --from zizmor zizmor
        --format=json
        --min-severity=medium
        --min-confidence=medium
        .github > security-evidence/security-zizmor.json
    - name: Upload workflow audit evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: workflow-audit-evidence
        path: security-evidence/
        if-no-files-found: ignore

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard only supports the repository default branch for branch dispatches.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - name: Run OpenSSF Scorecard
      uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
      with:
        results_file: scorecard-results.json
        results_format: json
        publish_results: true
    - name: Run OpenSSF Scorecard SARIF
      uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
      with:
        results_file: scorecard-results.sarif
        results_format: sarif
        publish_results: false
    - name: Upload Scorecard results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scorecard-results
        path: |
          scorecard-results.json
          scorecard-results.sarif
        if-no-files-found: error
