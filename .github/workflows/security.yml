name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

jobs:
  # CodeQL is managed by GitHub default setup for this repository. Adding an
  # advanced CodeQL workflow here makes GitHub reject uploaded SARIF.
  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: "3.11"
        activate-environment: true
    - name: Export locked runtime dependencies
      run: >
        uv export --frozen --no-dev --no-emit-project
        --format requirements-txt
        --output-file runtime-requirements.txt
    - name: Run pip-audit
      run: uv tool run --from pip-audit pip-audit --requirement runtime-requirements.txt --no-deps --disable-pip

  workflow_audit:
    name: GitHub Actions hardening audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: "3.11"
        activate-environment: true
    - name: Run zizmor
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        uv tool run --from zizmor zizmor
        --format=github
        --min-severity=medium
        --min-confidence=medium
        .github

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Run OpenSSF Scorecard
      uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
      with:
        results_file: scorecard-results.json
        results_format: json
        publish_results: true
    - name: Run OpenSSF Scorecard SARIF
      uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
      with:
        results_file: scorecard-results.sarif
        results_format: sarif
        publish_results: false
    - name: Upload Scorecard results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: scorecard-results
        path: |
          scorecard-results.json
          scorecard-results.sarif
        if-no-files-found: error
