name: Threshold audit A-B
on:
  push:
    branches: [codex/threshold-audit-linux]
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: b0664b345eef61edf578eff41fb59d64b5766e1a
          path: ax
      - uses: albumentations-team/ci-foundation/actions/setup-python-uv@6b9045dbea58026a1e8f96b0392c411934a27199
        with:
          activate-environment: "true"
          cache-dependency-glob: uv.lock
          cache-suffix: threshold
          python-version: "3.11"
          uv-version: "0.12.0"
      - name: Compare Dithering, Spatter and clipping routes
        shell: bash
        run: |
          set -euo pipefail
          uv pip install 'albucore==0.3.9' 'numpy==2.4.6' 'opencv-python-headless==5.0.0.93' 'numkong==7.8.7' 'stringzilla==5.3.2' pydantic pyyaml scipy typing-extensions 'simplejpeg==1.9.0' pytest hypothesis scikit-learn pytest-mock
          uv pip install 'torch==2.15.0' --index https://download.pytorch.org/whl/cpu
          mkdir -p results
          lscpu > results/cpu.txt
          export PYTHONPATH="$PWD/ax"
          python -u clip-final.py final-utils.py | tee results/clip.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: threshold-audit
          path: results/
