ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [ ]
  submodules: false

repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: check-ci-matrix
        name: Check CI support matrix consistency
        entry: python -m tools.ci_matrix check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.github/workflows/|docs/maintaining/|tools/ci_matrix\.py)
      - id: verify-regression-vectors
        name: Verify regression vector contracts
        entry: uv run python -m tools.verify_regression_vectors --all
        language: system
        pass_filenames: false
        files: ^(tests/regression/|tests/files/regression/|tools/(generate|verify)_regression_vectors\.py)
      - id: check-benchmark-coverage
        name: Check benchmark catalog coverage
        entry: uv run python -m tools.benchmark_coverage check
        language: system
        pass_filenames: false
        files: ^(albumentations/|benchmark/|tools/(benchmark_coverage|performance_budget|quality_gate)\.py)
      - id: check-compose-policy-and-tracing-contracts
        name: Check Compose policy and tracing contracts
        entry: uv run pytest -q tests/contracts/test_composition_serialization_contracts.py tests/test_composition_tracing.py
        language: system
        pass_filenames: false
        files: ^(albumentations/core/(bbox_utils|composition|keypoints_utils|serialization|tracing)\.py|tests/(contracts/test_composition_serialization_contracts|test_composition_tracing)\.py)$
      - id: check-legal-integrity
        name: Check license and CLA provenance integrity
        entry: python tools/verify_legal_integrity.py
        language: system
        pass_filenames: false
        files: ^(LICENSE$|LICENSE_HISTORY\.md$|LICENSING\.md$|THIRD_PARTY_NOTICES\.md$|THIRD_PARTY_LICENSES/|CLA\.md$|CONTRIBUTING\.md$|README\.md$|legal/cla/|pyproject\.toml$|MANIFEST\.in$|conda\.recipe/meta\.yaml$|docs/maintaining/license-provenance\.md$|tools/verify_legal_integrity\.py$|tests/test_legal_integrity\.py$|\.github/workflows/(pr|release-candidate|upload_to_pypi)\.yml$)
      - id: check-internal-workspace
        name: Reject staged local-only workspace files
        entry: python tools/check_internal_workspace.py
        language: python
        files: ^_internal/
  - repo: https://github.com/ternaus/ruff-policy-hooks
    rev: v0.4.0
    hooks:
      - id: check-ruff-suppressions
        name: Protect mandatory Ruff complexity diagnostics
        args: [--protect=C901,PLR0911,PLR0912,PLR0915]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        exclude: ^conda\.recipe/
      - id: check-xml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: check-json
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: requirements-txt-fixer
  - repo: local
    hooks:
    - id: check-docstrings
      name: Check Docstrings for '---' and '``' (double backticks)
      entry: python tools/check_docstring_format.py
      language: python
      types: [python]
      exclude: ^tools/
    - id: check-naming-conflicts
      name: Check for naming conflicts between modules and functions/classes
      entry: python -m tools.check_naming_conflicts
      language: python
      pass_filenames: false
    - id: check-example-docstrings
      name: Check for 'Examples' sections in transform classes (must be plural form)
      entry: python tools/check_example_docstrings.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
      additional_dependencies: ["google-docstring-parser>=0.0.7"]
    - id: check-no-defaults-in-schemas
      name: Check no defaults in BaseModel schemas
      entry: python tools/check_no_defaults_in_schemas.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
    - id: check-method-docstrings
      name: Check method docstrings (except apply methods, getters, and setters)
      entry: python tools/check_method_docstrings.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
    - id: check-random-usage
      name: Check for direct np.random/random module usage in transforms
      entry: python tools/check_random_usage.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
    - id: check-removed-sampling-hooks
      name: Forbid obsolete get_params sampling hooks
      entry: python tools/check_removed_sampling_hooks.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
    - id: check-scalar-numpy-math
      name: Check NumPy math is not used for proven Python scalars
      entry: python tools/check_scalar_numpy_math.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
    - id: check-transform-names
      name: Check new transform names do not use the Random prefix
      entry: python tools/check_transform_names.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
    - id: check-apply-no-defaults
      name: Check apply_* methods have no default argument values
      entry: python tools/check_apply_no_defaults.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
    - id: check-apply-method-length
      name: Keep apply methods thin
      entry: python tools/check_apply_method_length.py
      language: python
      types: [python]
      files: ^albumentations/(augmentations/|pytorch/)
      pass_filenames: true
    - id: check-fill-naming
      name: Check fill/fill_mask naming convention (not fill_value/fill_mask_value)
      entry: python tools/check_fill_naming.py
      language: python
      types: [python]
      files: ^albumentations/
      pass_filenames: true
    - id: check-cv2-geometric-forbidden
      name: Forbid cv2.warpAffine/warpPerspective/copyMakeBorder/remap (use albucore)
      entry: python tools/check_cv2_geometric_forbidden.py
      language: system
      files: ^albumentations/
      pass_filenames: false
    - id: check-transform-init-args-override
      name: Keep transform init arguments derived from public constructors
      entry: python tools/check_transform_init_args_override.py
      language: python
      types: [python]
      files: ^albumentations/
    - id: check-range-parameter-annotations
      name: Require transform range parameters to be tuple pairs
      entry: python tools/check_range_parameter_annotations.py
      language: python
      types: [python]
      files: ^albumentations/augmentations/
    - id: check-local-markdown-links
      name: Check local Markdown links
      entry: python tools/check_local_markdown_links.py
      language: python
      types: [markdown]
  - repo: local
    hooks:
      - id: check-albucore-version
        name: Check albucore version
        entry: python ./tools/check_albucore_version.py
        language: system
        files: pyproject.toml
      - id: check-conda-dependencies
        name: Check conda dependencies match pyproject.toml
        entry: python ./tools/check_conda_dependencies.py
        language: system
        files: ^(pyproject\.toml|conda\.recipe/meta\.yaml|tools/check_conda_dependencies\.py)$
      - id: check-readme-transforms-docs
        name: Check README transform tables match albumentations
        entry: uv run python -m tools.make_transforms_docs check README.md
        language: system
        pass_filenames: false
        files: ^(README\.md|albumentations/).*$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        exclude: '__pycache__/'
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: python-check-blanket-noqa
      - id: text-unicode-replacement-char
  - repo: https://github.com/Ternaus/numpy-assert-lint
    rev: v0.2.0
    hooks:
      - id: numpy-assert-lint
        files: ^tests/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli>=2.4.1"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^albumentations/
        additional_dependencies:
          - types-PyYAML>=6.0.12.20260518
          - types-setuptools>=83.0.0.20260706
          - pydantic>=2.13.4
        args:
          [ --config-file=pyproject.toml ]
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.0.dev2
    hooks:
      - id: pyrefly-check
        name: Pyrefly type check
        entry: uv run pyrefly check
        args:
          - --output-format=github
          - --error
          - unnecessary-type-conversion
          - --error
          - implicit-import
          - --error
          - redundant-cast
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/ternaus/google-docstring-parser
    rev: 0.0.11
    hooks:
      - id: check-google-docstrings
        files: ^albumentations/
        exclude: ^build/
        additional_dependencies: ["tomli>=2.4.1"]
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0  # or latest version
    hooks:
      - id: md-toc
        args: ["-p", "github", "-l", "6"]  # GitHub style, up to 6 levels deep
        files: ^README\.md$
