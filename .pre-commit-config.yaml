repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: check-ci-matrix
        name: Check CI support matrix consistency
        entry: python -m tools.ci_matrix check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.github/workflows/|docs/maintaining/|tools/ci_matrix\.py)
      - id: check-ax-rules
        name: Check AlbumentationsX rules
        entry: uv run python -m tools.ax_rules
        language: system
      - id: verify-regression-vectors
        name: Verify regression vector contracts
        entry: uv run python -m tools.verify_regression_vectors --all
        language: system
        pass_filenames: false
        files: ^(tests/regression/|tests/files/regression/|tools/(generate|verify)_regression_vectors\.py)
      - id: check-benchmark-coverage
        name: Check benchmark catalog coverage
        entry: uv run python -m tools.benchmark_coverage check
        language: system
        pass_filenames: false
        files: ^(albumentations/|benchmark/|tools/(benchmark_coverage|performance_budget)\.py)
      - id: check-compose-policy-and-tracing-contracts
        name: Check Compose policy and tracing contracts
        entry: uv run pytest -q tests/contracts/test_composition_serialization_contracts.py tests/test_composition_tracing.py
        language: system
        pass_filenames: false
        files: ^(albumentations/core/(bbox_utils|composition|keypoints_utils|serialization|tracing)\.py|tests/(contracts/test_composition_serialization_contracts|test_composition_tracing)\.py)$
      - id: check-legal-integrity
        name: Check license and CLA provenance integrity
        entry: python tools/verify_legal_integrity.py
        language: system
        pass_filenames: false
        files: ^(LICENSE$|LICENSE_HISTORY\.md$|LICENSING\.md$|THIRD_PARTY_NOTICES\.md$|THIRD_PARTY_LICENSES/|CLA\.md$|CONTRIBUTING\.md$|README\.md$|legal/cla/|pyproject\.toml$|MANIFEST\.in$|conda\.recipe/meta\.yaml$|docs/maintaining/license-provenance\.md$|tools/verify_legal_integrity\.py$|tests/test_legal_integrity\.py$|\.github/workflows/(pr|release-candidate|upload_to_pypi)\.yml$)
      - id: check-internal-workspace
        name: Reject staged local-only workspace files
        entry: python tools/check_internal_workspace.py
        language: python
        files: ^_internal/
  - repo: https://github.com/ternaus/ruff-policy-hooks
    rev: v0.4.0
    hooks:
      - id: check-ruff-suppressions
        name: Protect mandatory Ruff complexity diagnostics
        args: [--protect=C901,PLR0911,PLR0912,PLR0915]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        exclude: ^conda\.recipe/
      - id: check-xml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: check-json
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: requirements-txt-fixer
  - repo: local
    hooks:
    - id: check-local-markdown-links
      name: Check local Markdown links
      entry: python tools/check_local_markdown_links.py
      language: python
      types: [markdown]
  - repo: local
    hooks:
      - id: check-albucore-version
        name: Check albucore version
        entry: python ./tools/check_albucore_version.py
        language: system
        files: pyproject.toml
      - id: check-conda-dependencies
        name: Check conda dependencies match pyproject.toml
        entry: python ./tools/check_conda_dependencies.py
        language: system
        files: ^(pyproject\.toml|conda\.recipe/meta\.yaml|tools/check_conda_dependencies\.py)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        exclude: '__pycache__/'
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-use-type-annotations
      - id: python-check-blanket-noqa
      - id: text-unicode-replacement-char
  - repo: https://github.com/Ternaus/numpy-assert-lint
    rev: v0.2.0
    hooks:
      - id: numpy-assert-lint
        files: ^tests/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ["tomli>=2.4.1"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^albumentations/
        additional_dependencies:
          - types-PyYAML>=6.0.12.20260518
          - types-setuptools>=83.0.0.20260706
          - pydantic>=2.13.4
        args:
          [ --config-file=pyproject.toml ]
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.0.dev2
    hooks:
      - id: pyrefly-check
        name: Pyrefly type check
        entry: uv run pyrefly check
        args:
          - --output-format=github
          - --error
          - unnecessary-type-conversion
          - --error
          - implicit-import
          - --error
          - redundant-cast
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/ternaus/google-docstring-parser
    rev: 0.0.11
    hooks:
      - id: check-google-docstrings
        files: ^albumentations/
        exclude: ^build/
        additional_dependencies: ["tomli>=2.4.1"]
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0  # or latest version
    hooks:
      - id: md-toc
        args: ["-p", "github", "-l", "6"]  # GitHub style, up to 6 levels deep
        files: ^README\.md$
